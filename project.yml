name: Unreel
options:
  bundleIdPrefix: com.nikolaus
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: C5MSK2XBMK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Unreel:
    type: application
    platform: iOS
    sources:
      - path: Unreel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaus.Unreel
        INFOPLIST_FILE: Unreel/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
  UnreelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UnreelTests
    dependencies:
      - target: Unreel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nikolaus.UnreelTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Unreel:
    build:
      targets:
        Unreel: all
        UnreelTests: [test]
    test:
      targets:
        - UnreelTests
